server:
  host: 0.0.0.0
  port: 8000

game:
  default_names: ["Player 1", "Player 2"]
  start_score: 301
  double_out: true
  double_in: false
  # Advance automatically on the 3rd dart. The camera also advances the turn
  # when it sees the darts pulled out; the Next Player button always works too.
  auto_advance: true

audio:
  # Speak on the phone that's showing the scoreboard. Costs ~20 bytes per
  # callout instead of a 55KB WAV, so it works on a link too slow to stream
  # audio, and it can say real player names rather than "Player 2".
  browser: true

  # Play the pre-rendered WAVs on the Pi itself. Off by default: it needs a
  # speaker in the Pi's 3.5mm jack, and the phone is already in your hand.
  # Both can run at once if you want the cabinet to talk too.
  enabled: false
  sounds_dir: sounds
  # Empty means the system default, which on a Pi is HDMI and fails silently
  # when nothing is plugged into it. "plughw:2,0" is the 3.5mm jack; run
  # `aplay -l` to confirm the card number.
  device: "plughw:2,0"

vision:
  enabled: true

  # Save a crop of what the detector saw for each dart, with the chosen tip
  # marked. Only useful while tuning tip localisation -- leave empty in normal
  # play or it writes a PNG per dart forever.
  debug_dir: "/tmp/dartdebug"

  # ---- cameras ----------------------------------------------------------
  # The first camera listed is the primary: it drives the trigger (something
  # landed / a hand is at the board). Every camera that calibrates contributes
  # a position, and they are averaged -- which is the point of having two, since
  # a dart sticks out of the board and each camera misjudges that offset in a
  # different direction.
  #
  # name_hint matches a device under /dev/v4l/by-id and is preferred over a bare
  # index. /dev/video0 and /dev/video2 are handed out in enumeration order, so
  # which webcam is which can swap on a reboot -- and a silent swap means each
  # camera uses the other's calibration, which still scores, just wrongly.
  # List the options with:  ls /dev/v4l/by-id/
  #
  # Neither of these two cameras has usable focus. The onn advertises
  # focus_absolute and accepts writes -- v4l2-ctl reads the value back
  # faithfully -- but the picture does not change: swept 0..255 against the
  # board with each frame verified fresh, sharpness moved 91.6 to 93.4, a 1.02x
  # spread that is measurement noise. The other camera has no focus control at
  # all. So there is nothing to tune here, and `focus` below is kept only to
  # hold autofocus off; leaving autofocus on makes the lens hunt every time a
  # dart flies past, which is a real problem even when focusing is not.
  #
  # Writing focus_absolute *does* stall frame delivery on the onn for a few
  # seconds, through v4l2-ctl as much as through OpenCV. Harmless at startup,
  # which is the only place it happens -- but it silently invalidated a whole
  # focus sweep once, because every sample came back as the same frozen frame.
  # Any future sweep has to confirm consecutive frames actually differ.
  #
  # The consequence is that the onn is simply the soft one and cannot be fixed
  # from here. On crops of the same board scaled to a common size it carries
  # roughly a seventh of the detail the CyberTrack does -- 138 against 965 --
  # and that figure does not move with zoom or with capture resolution, so it
  # is the lens, focused for some distance that is not this one. It calibrates
  # well regardless, because calibration reads big shapes; expect it to be the
  # weaker of the two at pinning down a dart tip. The only remaining fixes are
  # physical: move it, or see whether its lens barrel turns by hand.
  cameras:
    - name: left-high
      name_hint: onn_4K_Webcam
      index: 0            # fallback if the by-id name isn't found
      # 1080p rather than 720p. Not for sharpness -- see the note below, this
      # camera has none to gain -- but for calibration, which reads the board's
      # outline out of the whole frame. Measured across repeated recalibrations:
      #   720p,  zoom 9   0.717 / 0.724     never a confident rotation lock
      #   720p,  zoom 0   0.712 / 0.359     erratic; board only ~227px across
      #   1080p, zoom 0   0.878 / 0.880 / 0.865   confident every time
      # At 1080p the full field of view puts ~339px across the board, the same
      # as zoom 9 managed at 720p, without cropping the frame the ellipse fit
      # needs. Costs about 38% of one Pi 4 at 15fps, which there is room for.
      width: 1920
      height: 1080
      fps: 15
      autofocus: false
      focus: 45
      # Found sitting at 9, its maximum, with nothing here having set it -- UVC
      # controls persist in the camera itself across reboots. See camera.py.
      #
      # Worth being precise about why it is off, because the obvious reason is
      # wrong: zoom 9 is *not* softer. Measured on this camera, same board, both
      # crops scaled to a common 300x420, the detail figures were 121.9 / 125.0
      # at zoom 9 against 112.3 / 122.6 at zoom 0 -- indistinguishable. It
      # crops the 4K sensor rather than upscaling, so the pixels it adds are
      # real. It is off only because at 1080p the full frame already gives the
      # same board size and calibrates better.
      zoom: 0
      autoexposure: true   # room is dim; auto settles on ~2000 and looks right
      # exposure: 250
      # This camera finds the board at a lower hue floor than the other one.
      # Measured: at h_lo 18 the fitted ellipse is the board and calibration
      # scores 0.74; the global window's 21 scores 0.60.
      yellow: {h_lo: 18, h_hi: 42, s_lo: 85, v_lo: 70}

    # The lower of the two, looking up at the board. A CyberTrack H4: fixed
    # focus, and unlike the onn it does not even advertise the control, so the
    # calls no-op. Its picture is the sharper of the two regardless -- on
    # same-sized crops of the board it resolved the printed numerals cleanly
    # while the onn, then at full digital zoom, came out smeared.
    - name: left-low
      name_hint: USB_2.0_Camera
      index: 2
      width: 1280
      height: 720
      fps: 15
      autofocus: false
      # Manual, because auto-exposure meters the whole frame and this camera's
      # frame is three-quarters doorway, white door and fridge. Left on auto it
      # stopped down to 312us and the board came out at median grey 69 with a
      # standard deviation of 38, against 128/70 on the onn -- half the
      # brightness and half the contrast. That is what the detector then has to
      # find a dark dart against, and it showed: blobs came back 449-1407px
      # here against 1070-3166px on the onn, i.e. only the brightest
      # fragments of each dart, which is exactly what ruins tip localisation.
      #
      # Measured sweep of board contrast against exposure:
      #    312 -> med  50, std 29      1400 -> med 140, std 46
      #    600 -> med  82, std 42      2000 -> med 166, std 40
      #    900 -> med 108, std 47      3000 -> med 190, std 29
      # It peaks around 900-1400 and falls away as the board washes out.
      autoexposure: false
      exposure: 1100
      # The pipeline retunes this as the room's light changes, metering the
      # board rather than the whole frame. The bounds are wide on purpose.
      #
      # A narrow ceiling here was a mistake worth recording. One evening the
      # loop drove this to 1610, the yellow mask went to 124k pixels across 146
      # blobs and the board finder fitted the doorway, so the ceiling was pinned
      # at 1400. Two hours later, with the room darker, a sweep said the
      # opposite: at 1400 the mask was 91k across 85 blobs and the board could
      # not be found at all, and it got *cleaner* as exposure rose --
      # 58k across 59 blobs at 2200, where the board is found and the contrast
      # is best.
      #
      # So mask quality tracks the light in the room, not the exposure by
      # itself, and 1610 was only ever wrong for how bright the room was at the
      # time. A fixed ceiling fights the loop that exists to handle exactly
      # that. The safety net is the template-match gate, which rejects a
      # calibration of the wrong object outright -- not a narrow range of
      # exposures that happens to have been right once.
      exposure_min: 500
      exposure_max: 2600
      # UNRESOLVED, and still unresolved after the two cameras swapped places.
      # It no longer locks onto the doorway -- the template gate now rejects
      # that outright at 0.23-0.25 against a 0.45 requirement -- but it does not
      # find the board either, scoring 0.23-0.31 against the 0.35 calibration
      # gate. So it still contributes no darts and every throw scores from one
      # camera. Failing loudly is an improvement on scoring off the door frame,
      # but only that.
      #
      # On saved frames a higher hue floor fixes it -- at the global h_lo of 21
      # the fitted ellipse is 853x1572 and 1037x1445 on a 1280x720 frame, i.e.
      # bigger than the frame; at 24 it settles on ~300x540, which is the board,
      # stably across s_lo 30-100, scoring 0.66-0.75. Live it does not
      # reproduce: h_lo 24 scored 0.388 and the overlay grid still spanned the
      # whole frame.
      #
      # The likely reason is in the picture rather than the threshold: the board
      # occupies a small corner of this camera's frame, so it is neither the
      # biggest yellow thing nor big enough to read. Worth trying an override
      # here once the camera is aimed so the board fills more of the frame:
      # yellow: {h_lo: 24, h_hi: 42, s_lo: 70, v_lo: 70}

  # ---- board geometry ---------------------------------------------------
  # Defaults are regulation, which is right for this board (regulation
  # scoring face, just without the separate number ring).
  #
  # If you measure the double ring's OUTER edge and it isn't 170 mm from the
  # bull centre, set it here and every other ring scales to match:
  # double_outer_mm: 170.0
  #
  # Or pin individual rings, all in mm from the bull centre:
  # rings:
  #   inner_bull: 6.35
  #   outer_bull: 15.9
  #   triple_inner: 99.0
  #   triple_outer: 107.0
  #   double_inner: 162.0
  #   double_outer: 170.0

  # ---- board colour -----------------------------------------------------
  # Calibration finds the board by its yellow paint. If it can't lock on under
  # your lighting, get the numbers from:
  #     python tools/check_calib.py samples/board.jpg --tune
  #
  # The competitor is the tan cardboard behind the cabinet doors, and *hue* is
  # what separates it -- measured at this camera angle:
  #
  #     board            H 20/24/32   S  45/142/212     (p10/median/p90)
  #     cardboard right  H 16/17/20   S  86/167/174
  #     cardboard bottom H 15/16/18   S 141/155/165
  #
  # Note the cardboard is *more* saturated than the board, so raising s_lo eats
  # the board and leaves the cardboard -- which is exactly the wrong way round,
  # and cost an hour. h_lo=21 splits them cleanly, and the resulting ellipse is
  # stable at (660,434) across h_lo 19-22 and s_lo 60-100.
  #
  # These are still fixed thresholds and still fragile: which channel does the
  # separating changed when the camera moved. See the README's known limits.
  yellow: {h_lo: 21, h_hi: 42, s_lo: 80, v_lo: 70}

  # ---- detector tuning --------------------------------------------------
  # Raise min_area if shadows register as darts; lower it if thin darts are
  # missed. hand_mass is the "a person is at the board" threshold.
  detector:
    min_area: 250
    diff_threshold: 28
    min_elongation: 2.0

  # ---- development ------------------------------------------------------
  # Replay a still or a video instead of a live camera, so tip detection can
  # be worked on away from the board:
  # file_sources:
  #   left-low: samples/board_empty.jpg
